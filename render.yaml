services:
  - type: web
    name: hallederiz-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Public HTTPS API URL, available at Docker build time and runtime.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_USE_DEMO_DATA
        value: "false"
      - key: NEXT_PUBLIC_ENABLE_DEMO_AUTH
        value: "false"
      - key: AUTH_SESSION_SECRET
        generateValue: true

  - type: web
    name: hallederiz-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: checksPass
    preDeployCommand: node packages/database/dist/cli.js migrate:apply
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENCE_MODE
        value: postgres
      - key: WORKER_MODE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hallederiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hallederiz-cache
          property: connectionString
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: TENANT_ENCRYPTION_KEY
        generateValue: true
      - key: API_CORS_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: ALLOW_DEMO_FALLBACK
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: disabled

  - type: worker
    name: hallederiz-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: production
      - key: PERSISTENCE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: hallederiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hallederiz-cache
          property: connectionString

  - type: keyvalue
    name: hallederiz-cache
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: hallederiz-db
    region: frankfurt
    plan: basic-1gb
